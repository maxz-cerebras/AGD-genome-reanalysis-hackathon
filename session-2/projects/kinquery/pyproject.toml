[project]
name = "kinquery"
version = "0.1.0"
description = "Challenge 8: natural-language cohort finder over PhenoTips family phenopackets"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
